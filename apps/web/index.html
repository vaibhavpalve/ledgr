<!doctype html>
<!--
  IAM-010g: the product's default language, and what the very first paint is
  in before React resolves this device's own choice. `en` here was wrong in
  both directions — it is not the default (PRD §20 falls back to Dutch), and a
  screen reader would announce a Dutch login screen in an English voice for as
  long as it stood.

  Corrected at runtime by useDocumentLanguage the moment the tree mounts, and
  kept correct on every switch (WCAG 2.2 SC 3.1.1, FR-LOC-004). Both are
  needed: this covers the gap before the app runs, that covers every moment
  after it.
-->
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LEDGR</title>

    <!--
      THEME, BEFORE FIRST PAINT (ADR-055).

      This runs synchronously in <head>, ahead of the stylesheet and the module
      bundle, because anything later is too late: the browser would paint one
      frame of the light ground before React mounted and stamped the choice,
      which is the white flash every dark-mode user recognises and resents.

      It is a hand-written copy of `readThemePreference` + `applyTheme` from
      @ledgr/design-tokens/src/theme.ts, and it has to be — a module import
      cannot run before paint. `theme.test.ts` asserts this copy still agrees
      with that module, so the duplication cannot silently drift.

      "system" deliberately stamps NOTHING, leaving the `prefers-color-scheme`
      media query in tokens.css to decide and to keep following the OS if it
      changes while the tab is open.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ledgr.theme.v1");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) {
          /* Private windows and blocked site data throw here. The media query
             in tokens.css is a complete fallback, so there is nothing to do. */
        }
      })();
    </script>

    <!--
      `media`/`onload` so the two <meta name="theme-color"> rules below are
      evaluated by the browser rather than by script: the address bar on
      Android and the title bar of an installed PWA cannot read a CSS custom
      property, so these are the one place a resolved colour has to be
      written literally. Values are `surface-ground` from each theme —
      the chrome should continue the page, not announce the brand.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f0e9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15120e" />

    <!--
      Source Sans 3 and Source Serif 4 — the pairing the design system is
      built on. The serif carries monetary figures and page titles; no other
      Dutch bookkeeping product sets amounts in a serif, and it is the
      cheapest thing that makes a LEDGR screenshot recognisable.

      Self-hosted from /fonts/ since ADR-061 (the @font-face rules live in
      @ledgr/design-tokens/tokens.css, next to the font tokens they serve).
      No third-party request leaves the page for typography any more — the
      PRIV gap ADR-055 named. The two preloads start the fetch before the
      stylesheet has been parsed; `crossorigin` is required on a font preload
      even for same-origin files, or the browser fetches it twice.
    -->
    <link
      rel="preload"
      href="/fonts/SourceSans3VF-Upright.ttf.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/SourceSerif4Variable-Roman.ttf.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      §5.2/MOB-002: "the cheapest route is an installable PWA with camera
      access" (ADR-046). The icons are the double-ruled mark from
      Wordmark.tsx on the accent tile: the SVG favicon for every modern
      browser, the 192 PNG as the fallback and the Apple touch icon.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
