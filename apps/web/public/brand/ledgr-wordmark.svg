<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 40" width="176" height="40" role="img" aria-label="LEDGR">
  <!--
    LEDGR wordmark lockup, ink version (for paper surfaces).

    Glyph: the double-ruled column from apps/web/src/Wordmark.tsx — two entries
    ruled off by a double line, the bookkeeper's notation for a final figure
    (ADR-055). Scaled 1.4x from the 20-unit icon grid so the painted stroke
    matches the 22px in-app mark at this 28px size.

    Word: Source Serif 4 semibold, letter-spacing 0.055em, cap height aligned
    to the glyph's top rule. The face is self-hosted by the app (ADR-058);
    outside the app the fallback is Georgia. Clear space around the lockup
    is the glyph width (28px) on every side.

    Light version for the marketing rail: ledgr-wordmark-light.svg.
  -->
  <g transform="translate(0 6) scale(1.4)" fill="none" stroke="#00686C" stroke-linecap="round">
    <path d="M4 5.5h12M4 9.5h7.5" stroke-width="1.5"/>
    <path d="M4 14h12M4 16.5h12" stroke-width="1.2"/>
  </g>
  <text x="40" y="29.5" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="27" font-weight="600" letter-spacing="1.5" fill="#26221C">LEDGR</text>
</svg>
