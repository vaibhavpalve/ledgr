<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    LEDGR favicon. The double-ruled column from Wordmark.tsx (ADR-055) on a
    teal tile: two entries, ruled off. Drawn directly on a 32 grid rather than
    scaled from the 20-unit icon grid, so the strokes stay heavy enough to
    read at 16px. The tile is the light-theme accent #00686C and is the same
    in both themes: a brand mark, not a themed surface.
  -->
  <rect width="32" height="32" rx="7" fill="#00686C"/>
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none">
    <path d="M8 9.5h16M8 14.5h10" stroke-width="2.6"/>
    <path d="M8 21h16M8 25h16" stroke-width="2.1"/>
  </g>
</svg>
