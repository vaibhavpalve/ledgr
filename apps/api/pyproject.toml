[project]
name = "ledgr-api"
version = "0.0.0"
description = "LEDGR API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "pyjwt>=2.9.0",
  "pydantic-settings>=2.6.0",
  "cryptography>=43.0.0",
  "azure-keyvault-keys>=4.9.0",
  "azure-identity>=1.19.0",
  # ADR-062: production KMS (Google Cloud KMS) and blob storage (Cloudflare
  # R2, spoken via its S3-compatible API - R2 has no native SDK) adapters.
  # azure-keyvault-keys/azure-identity above stay until gcp-kms is selected
  # in every non-local environment, per that ADR's own Consequences.
  "google-cloud-kms>=2.24.0",
  "aioboto3>=13.0.0",
  "argon2-cffi>=23.1.0",
  "httpx>=0.27.2",
  "webauthn>=3.0.0",
  "pyotp>=2.9.0",
  # SI-02: the EPC069-12 "pay by bank" QR code on an invoice PDF. Pure
  # Python, zero dependencies, emits raw PNG bytes directly - no Pillow, in
  # keeping with ADR-044's "no image library in this project's dependency
  # set" posture. See api.invoicing.epc_qr.
  "segno>=1.6.0",
]

[dependency-groups]
dev = [
  "ruff>=0.7.4",
  "mypy>=1.13.0",
  "pytest>=8.3.3",
  "pytest-cov>=6.0.0",
  "pip-audit>=2.7.3",
  "pytest-asyncio>=0.24.0",
  # NFR-042: "The accounting engine has property-based tests asserting
  # invariants (balance, immutability, period integrity)." Property-based, not
  # example-based, so the generator has to come from somewhere.
  "hypothesis>=6.100.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

# FR-LOC-001: the message catalogue is shared with the web and mobile apps and
# lives outside apps/api, so it is not picked up by `packages` above. Without
# this, a built wheel starts and then raises on the first user-facing string -
# api.i18n.catalogue resolves the checkout path, which is not there in a
# container.
#
# The alternative was a copy inside apps/api, kept in step by a script. That is
# the arrangement this whole package exists to avoid: two copies of a sentence
# are two sentences, and they drift.
[tool.hatch.build.targets.wheel.force-include]
"../../packages/i18n/catalogue" = "api/i18n/catalogue"

# FR-AR-002: the invoice wording review record. Read at RUNTIME by
# api.invoicing.wording - unlike data/vat/nl-vat-rules.json, which only a
# script loads - so a wheel without it would raise on the first invoice. Same
# failure mode as the catalogue above, same fix.
"data/invoicing" = "api/invoicing/data"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection relies on Depends(...)/Query(...)/etc. as
# argument defaults - that's the framework's documented pattern, not the
# mutable-default-argument bug B008 otherwise correctly catches.
#
# The api.authz.dependencies entries are the same case one level in: they
# appear INSIDE Depends(...) in a route signature, and each returns either a
# frozen dataclass or a fresh closure over frozen values. None of them can be
# mutated by a request, which is the property B008 exists to protect.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "api.authz.dependencies.require_permission",
  "api.authz.dependencies.organization_scope",
  "api.authz.dependencies.administration_from_path",
  "api.authz.dependencies.AttributeSources",
  "api.authz.dependencies.from_body",
  "api.authz.dependencies.from_path",
  "api.authz.dependencies.from_query",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

# aioboto3 (ADR-062's R2 adapter, api.documents.storage.R2BlobStore) ships no
# stubs and no py.typed marker - its client is generated dynamically from
# botocore's service model at runtime, so there is no first-party fix akin to
# "wait for the library to add types". Scoped narrowly to this one module
# rather than a blanket ignore_missing_imports, so a future untyped import
# elsewhere still fails loudly.
[[tool.mypy.overrides]]
module = "aioboto3.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "isolation(method, path): declares this test as the IAM-005 tenant-isolation coverage for the given route",
]
